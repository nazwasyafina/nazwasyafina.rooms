<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Perpustakaan Salwa Nadira</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            overflow: hidden;
            background: linear-gradient(135deg, #74ebd5, #9face6);
        }

        /* Sparkle / sinar layer */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1.5px 1.5px at 60% 20%, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 80% 70%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.5), transparent);
            animation: sparkleMove 14s linear infinite;
        }

        body::after {
            animation-duration: 20s;
            opacity: 0.6;
        }

        @keyframes sparkleMove {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-120px);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 18px;
            animation: fadeIn 1.8s ease-in-out;
        }

        h1 {
            font-size: 50px;
            margin: 0;
            letter-spacing: 4px;
            font-weight: 700;
            color: #1f3c88;
        }

        p {
            font-size: 18px;
            margin-top: 24px;
            line-height: 1.8;
            font-weight: 400;
            color: #333;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 34px;
            }
            .container {
                padding: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>COMING SOON DIGITAL LIBRARY</h1>
        <p>
            Website ini sedang dikembangkan. Beberapa fitur dan konten masih dalam proses
            penyusunan agar nantinya dapat digunakan secara optimal.
            Terima kasih sudah berkunjung, sampai jumpa dalam waktu dekat!
        </p>
    </div>
</body>
</html>
