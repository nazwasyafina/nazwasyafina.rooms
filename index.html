<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Perpustakaan Salwa Nadira</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            color: #e6e9ff;
            background: radial-gradient(
                circle at top,
                #2b1055,
                #1b1f4b,
                #090a1a
            );
            overflow: hidden;
            position: relative;
        }

        /* Stars background */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1.2px 1.2px at 80% 60%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1.8px 1.8px at 70% 80%, rgba(255,255,255,0.9), transparent);
            animation: starsTwinkle 8s ease-in-out infinite alternate;
        }

        body::after {
            animation-duration: 12s;
            opacity: 0.6;
        }

        @keyframes starsTwinkle {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            padding: 20px;
            animation: fadeIn 1.6s ease-out;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        p {
            margin-top: 26px;
            font-size: 18px;
            line-height: 1.9;
            font-weight: 300;
            opacity: 0.95;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 { font-size: 32px; }
            p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>COMING SOON DIGITAL LIBRARY</h1>
        <p>
            Website ini sedang dikembangkan. Beberapa fitur dan konten masih dalam proses
            penyusunan agar nantinya dapat digunakan secara optimal.
            Terima kasih sudah berkunjung, sampai jumpa dalam waktu dekat!
        </p>
    </div>

</body>
</html>
