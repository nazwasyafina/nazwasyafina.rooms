<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Digital Library</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            color: #1e1e2f;
            background: linear-gradient(
                135deg,
                #a1c4fd,
                #c2e9fb,
                #fbc2eb
            );
            overflow: hidden;
            position: relative;
        }

        /* ✨ Sparkle layer */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 15% 20%, rgba(255,255,255,0.9), transparent),
                radial-gradient(3px 3px at 40% 60%, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 70% 30%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1.5px 1.5px at 85% 75%, rgba(255,255,255,0.9), transparent),
                radial-gradient(2.5px 2.5px at 55% 15%, rgba(255,255,255,0.6), transparent);
            animation: sparkle 4s ease-in-out infinite alternate;
        }

        @keyframes sparkle {
            from { opacity: 0.4; }
            to   { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            padding: 20px;
            animation: fadeUp 1.2s ease-out;
        }

        h1 {
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        p {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.8;
            color: #2a2a3d;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 34px;
            }
            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>COMING SOON DIGITAL LIBRARY</h1>
        <p>
            Website ini lagi dikembangin 🚀<br>
            Stay tuned ya, bakal hadir ruang literasi digital yang fresh, modern,
            dan pastinya useful banget!
        </p>
    </div>

</body>
</html>
